<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philippe Tavares — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Wrapper para a animação de queda total -->
  <div id="main-wrapper" class="main-wrapper">

    <div class="login-card">
      <div class="avatar-wrap">
        <div class="avatar">PT</div>
      </div>

      <div class="login-title">Philippe Tavares</div>
      <div class="login-subtitle">
        Portfólio pessoal<br>
        <span>// dev júnior · BR — AL</span>
      </div>

      <div class="puzzle-area">
        <div class="puzzle-hint">// deslize o encaixe</div>
        <div id="puzzle-slot" class="puzzle-slot"></div>
        <div id="puzzle-piece" class="puzzle-piece">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 17 18 12 13 7"></polyline>
            <polyline points="6 17 11 12 6 7"></polyline>
          </svg>
        </div>
      </div>

      <button class="btn-guest" onclick="enterPortfolio()">
        Entrar como visitante
      </button>

      <div class="login-footer">
        philippetavares00@gmail.com
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>

</html>
