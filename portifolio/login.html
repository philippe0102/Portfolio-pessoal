<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Moderno</title>

<link rel="stylesheet" href="login.css">

</head>
<body>

<div class="container">

    <!-- LOGIN -->
    <div class="form-box active" id="loginBox">
        <h2>Login</h2>

        <form id="loginForm">
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>

            <div class="forgot">
                <a href="#" onclick="showForgot()">Esqueceu a senha?</a>
            </div>

            <button type="submit">LOGIN</button>
        </form>

        <p>Não tem conta? <span onclick="showRegister()">Cadastre-se</span></p>
    </div>


    <!-- CADASTRO -->
    <div class="form-box" id="registerBox">
        <h2>Cadastro</h2>

        <form id="registerForm">
            <input type="text" placeholder="Nome completo" required>
            <input type="email" placeholder="E-mail" required>
            <input type="password" placeholder="Senha" required>

            <div class="g-recaptcha" data-sitekey="SEU_SITE_KEY_AQUI"></div>

            <button type="submit">CADASTRAR</button>
        </form>

        <p>Já tem conta? <span onclick="showLogin()">Entrar</span></p>
    </div>


    <!-- ESQUECEU SENHA -->
    <div class="form-box" id="forgotBox">
        <h2>Recuperar Senha</h2>

        <form id="forgotForm">
            <input type="email" placeholder="Digite seu e-mail" required>

            <div class="g-recaptcha" data-sitekey="SEU_SITE_KEY_AQUI"></div>

            <button type="submit">ENVIAR</button>
        </form>

        <p><span onclick="showLogin()">Voltar para login</span></p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
